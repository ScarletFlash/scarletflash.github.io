<span class="relative" #dynamicValuesContainer>
  @for (item of currentItem(); track item.id) {
    <app-text-roulette-animated-item
      class="transition-[opacity,translate,rotate] duration-500 ease-in-out starting:opacity-0 starting:translate-x-[10%] starting:translate-y-[180%] starting:-rotate-1"
      animate.leave="opacity-0 translate-x-[10%] -translate-y-[180%] rotate-1"
      >{{ item.text }}</app-text-roulette-animated-item
    >
  }
</span>
