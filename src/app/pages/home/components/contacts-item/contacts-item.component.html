<a
  [href]="href()"
  target="_blank"
  class="group outline-hidden"
>
  <button
    class="size-8 rounded outline-offset-8 outline-accent select-none group-focus:outline focus:outline-1"
    tabindex="-1"
  >
    <img
      [ngSrc]="iconSrc()"
      [alt]="title()"
      width="32"
      height="32"
      class="pointer-events-none invert transition-transform group-hover:scale-125 group-focus:scale-125"
    />
  </button>
</a>
