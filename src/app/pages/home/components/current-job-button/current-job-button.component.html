<a
  [href]="href()"
  target="_blank"
  class="group outline-hidden"
>
  <button
    class="relative rounded-md border px-4 py-3 outline-offset-8 outline-accent transition-shadow select-none group-hover:shadow-[0_0_24px_var(--accent-color)] group-focus:shadow-[0_0_24px_var(--accent-color)] group-focus:outline focus:outline-1"
    tabindex="-1"
  >
    <ng-content></ng-content>

    <section
      class="absolute top-0 left-0 -z-10 size-full translate-x-1.5 translate-y-1.5 rounded-md bg-accent transition-transform group-hover:translate-x-0 group-hover:translate-y-0 group-focus:translate-x-0 group-focus:translate-y-0"
    ></section>
  </button>
</a>
