<section class="sticky top-0 flex min-h-svh flex-col items-center justify-center py-5">
  <section class="flex grow flex-col items-center justify-center">
    <section
      class="z-10 flex h-fit flex-col items-center justify-center gap-24 rounded-sm border border-gray-300/10 bg-gray-300/10 backdrop-blur-sm select-text min-[830px]:ml-[clamp(calc(72px/2),calc(12.5vw/2),calc(160px/2))] min-[830px]:flex-row"
    >
      <section class="relative w-[12.5vw] max-w-40 min-w-18">
        <app-avatar class="absolute left-0 w-[200%] -translate-x-1/4 -translate-y-1/2"></app-avatar>
      </section>

      <section class="flex min-w-80 flex-col px-6 py-5 text-lg">
        <span>Hello and welcome! 👋</span>

        <span>
          I'm
          <h1 class="inline">Fedor Usakov</h1>
          ―&nbsp;
          <app-text-roulette
            swap-frequency="1750"
            [values]="[
              'software developer',
              'metalhead',
              'innovation seeker',
              'spell-caster',
              'experienced mentor',
              'seasoned manager',
              'coffee nerd',
              'system architect'
            ]"
          ></app-text-roulette>
        </span>

        <app-current-job-button
          class="mt-7 md:text-nowrap"
          href="https://sibe.io/?utm_source=usakov.dev&utm_medium=header-button"
        >
          Currently building the future of 3D collab with the epic Sibe squad 🚀
        </app-current-job-button>
      </section>
    </section>
  </section>

  <section class="h-10">
    <app-contacts
      class="fixed inset-x-0 bottom-5 transition-[translate,visibility] duration-350 ease-[cubic-bezier(0.2,1.8,0.4,1)] [view-transition-name:first-screen-contacts] data-aligned:invisible data-aligned:translate-y-[calc(100%+(--spacing(5)))] data-aligned:ease-[cubic-bezier(0.4,-0.9,0.7,0)] motion-reduce:transition-none"
      [attr.data-aligned]="isFirstScreenAligned() ? '' : null"
      [contacts]="[
        {
          title: 'Email',
          iconSrc: '/icons/mail.svg',
          href: 'mailto:f@usakov.dev'
        },
        {
          title: 'LinkedIn',
          iconSrc: '/icons/linkedin.svg',
          href: 'https://linkedin.com/in/usakov/'
        },
        {
          title: 'Instagram',
          iconSrc: '/icons/instagram.svg',
          href: 'https://instagram.com/f.usakov/'
        }
      ]"
    ></app-contacts>
  </section>
</section>

<section
  class="h-svh"
  aria-hidden="true"
></section>
