<section class="sticky top-0 flex min-h-svh flex-col items-center justify-center py-5">
  <section class="grow flex flex-col items-center justify-center">
    <section
      class="flex flex-col min-[830px]:flex-row items-center justify-center gap-24 h-fit z-10 backdrop-blur-sm bg-gray-300/10 border border-gray-300/10 min-[830px]:ml-[clamp(calc(72px/2),calc(12.5vw/2),calc(160px/2))] rounded-sm"
    >
      <section class="min-w-[72px] w-[12.5vw] max-w-[160px] relative">
        <app-avatar
          class="absolute w-[200%] -translate-x-1/4 -translate-y-1/2 left-0"
        ></app-avatar>
      </section>

      <section class="flex flex-col min-w-80 text-lg px-6 py-5">
        <span>Hello and welcome! 👋</span>

        <span>
          I'm
          <h1 class="inline">Fedor Usakov</h1>
          ―&nbsp;
          <app-text-roulette
            swap-frequency="1750"
            [values]="[
              'software developer',
              'metalhead',
              'innovation seeker',
              'spell-caster',
              'experienced mentor',
              'seasoned manager',
              'coffee nerd',
              'system architect'
            ]"
          ></app-text-roulette>
        </span>

        <app-current-job-button
          class="mt-7 md:text-nowrap"
          href="https://sibe.io/?utm_source=usakov.dev&utm_medium=header-button"
        >
          Currently building the future of 3D collab with the epic Sibe squad 🚀
        </app-current-job-button>
      </section>
    </section>
  </section>

  <div class="h-10">
    <app-contacts
      class="fixed inset-x-0 bottom-5 [view-transition-name:first-screen-contacts] transition-[translate,visibility] duration-350 ease-[cubic-bezier(0.2,1.8,0.4,1)] motion-reduce:transition-none data-aligned:invisible data-aligned:translate-y-[calc(100%+--spacing(5))] data-aligned:ease-[cubic-bezier(0.4,-0.9,0.7,0)]"
      [attr.data-aligned]="isAligned() ? '' : null"
      [contacts]="[
        {
          title: 'Email',
          iconSrc: '/icons/mail.svg',
          href: 'mailto:f@usakov.dev'
        },
        {
          title: 'LinkedIn',
          iconSrc: '/icons/linkedin.svg',
          href: 'https://linkedin.com/in/usakov/'
        },
        {
          title: 'Instagram',
          iconSrc: '/icons/instagram.svg',
          href: 'https://instagram.com/f.usakov/'
        }
      ]"
    ></app-contacts>
  </div>
</section>

<div class="h-svh" aria-hidden="true"></div>
