<section #root class="flex flex-col gap-[300px]">
  @defer (on idle) {
    <app-background
      class="fixed inset-x-0 top-0 h-lvh -z-10 pointer-events-none"
      movement-step-duration="2000"
    />
  }

  <div #openingPinWrapper>
    <section class="sticky top-0 flex min-h-svh flex-col">
      <router-outlet [name]="homeOutletName.FirstScreen" />
    </section>

    <div #openingSpacer class="h-svh" aria-hidden="true"></div>
  </div>

  <section #sibeBlock>
    <router-outlet [name]="homeOutletName.Sibe" />
  </section>

  <section #bimeisterBlock>
    <router-outlet [name]="homeOutletName.Bimeister" />
  </section>

  <div #closingPinWrapper>
    <section class="sticky top-0 flex min-h-svh flex-col">
      <router-outlet [name]="homeOutletName.Contacts" />
    </section>

    <div class="h-svh" aria-hidden="true"></div>
  </div>
</section>
