name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check_codebase:
    runs-on: ubuntu-latest
    name: Run codebase health checks
    steps:
      - name: Fetch the repository
        uses: actions/checkout@v7

      - name: Restore caches
        id: caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .turbo/
            !.turbo/runs/
            .*cache
          key:
            ${{ runner.os }}-check-${{ github.ref_name == github.event.repository.default_branch &&
            format('default-branch-{0}', github.sha) || github.sha }}
          restore-keys: |
            ${{ runner.os }}-check-default-branch-
            ${{ runner.os }}-check-

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run codebase checks
        run: pnpm run check-all

      - name: Save caches
        if: ${{ always() && steps.caches.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .turbo/
            !.turbo/runs/
            .*cache
          key: ${{ steps.caches.outputs.cache-primary-key }}
